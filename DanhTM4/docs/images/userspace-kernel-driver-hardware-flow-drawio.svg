<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Luồng userspace, kernel, driver và hardware</title>
  <desc id="desc">Application gọi syscall vào kernel, kernel dispatch tới subsystem hoặc driver rồi tương tác với hardware.</desc>
  <defs>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#303030}.title{font-size:31px;font-weight:600}.h{font-size:20px;font-weight:600}.s{font-size:15px}.box{fill:#f0efff;stroke:#8b5cf6;stroke-width:2}.panel{fill:#fffef0;stroke:#8b5cf6;stroke-width:2}.line{fill:none;stroke:#333333;stroke-width:2.5}.arrow{fill:#333333}</style>
  </defs>
  <rect class="panel" fill="#fffef0" stroke="#8b5cf6" stroke-width="2" x="15" y="15" width="1170" height="620"/>
  <text class="title" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="31" font-weight="700" x="600" y="57" text-anchor="middle">Từ userspace tới kernel, driver và hardware</text>

  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="125" y="90" width="950" height="90"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="600" y="125" text-anchor="middle">USERSPACE - ring 3</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="600" y="153" text-anchor="middle">Application gọi libc wrapper: openat, read/write, ioctl, mmap, poll</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M600 180 V233"/><polygon class="arrow" points="600,233 594,221 606,221"/><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="620" y="208">system call</text>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="125" y="233" width="950" height="105"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="600" y="270" text-anchor="middle">KERNEL SPACE - syscall entry, VFS, subsystem</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="600" y="299" text-anchor="middle">validate dữ liệu -> tìm kernel object từ fd -> dispatch callback</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="600" y="322" text-anchor="middle">Không phải syscall nào cũng chạm driver hoặc hardware</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M600 338 V391"/><polygon class="arrow" points="600,391 594,379 606,379"/><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="620" y="366">file_operations / subsystem API</text>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="125" y="391" width="950" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="600" y="426" text-anchor="middle">DRIVER / KERNEL SUBSYSTEM</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="600" y="454" text-anchor="middle">queue work, quản lý buffer/DMA, lập trình register, chờ completion</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M600 479 V532"/><polygon class="arrow" points="600,532 594,520 606,520"/><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="620" y="507">MMIO / PIO / DMA / CPU instruction</text>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="125" y="532" width="950" height="72"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="600" y="576" text-anchor="middle">HARDWARE - CPU, RAM, bus, controller, disk, NIC</text>
</svg>
