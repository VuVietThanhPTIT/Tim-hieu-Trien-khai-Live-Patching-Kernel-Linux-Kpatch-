<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Ba luồng I/O thường gặp</title>
  <desc id="desc">So sánh đọc file từ page cache, đọc block qua driver DMA interrupt và ioctl điều khiển device.</desc>
  <defs>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#303030}.title{font-size:32px;font-weight:600}.h{font-size:19px;font-weight:600}.s{font-size:15px}.lane{fill:#fffef0;stroke:#8b5cf6;stroke-width:2}.tag{fill:#e5e1ff;stroke:#8b5cf6;stroke-width:2}.box{fill:#f4f2ff;stroke:#8b5cf6;stroke-width:2}.line{fill:none;stroke:#333333;stroke-width:2.5}.arrow{fill:#333333}.return{fill:none;stroke:#568d60;stroke-width:2.5}.return-arrow{fill:#568d60}</style>
  </defs>
  <rect x="15" y="15" width="1410" height="870" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="title" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="31" font-weight="700" x="720" y="58" text-anchor="middle">Ba luồng I/O thường gặp</text>

  <rect class="lane" fill="#fffef0" stroke="#8b5cf6" stroke-width="2" x="45" y="90" width="1350" height="210"/>
  <rect class="tag" fill="#e5e1ff" stroke="#8b5cf6" stroke-width="2" x="45" y="90" width="230" height="210"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="160" y="165" text-anchor="middle">Đọc file</text><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="160" y="194" text-anchor="middle">đã cache</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="160" y="235" text-anchor="middle">không chạm disk</text>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="320" y="147" width="140" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="390" y="200" text-anchor="middle">Application</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M460 191 H550"/><polygon class="arrow" points="550,191 538,185 538,197"/><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="505" y="174" text-anchor="middle">read()</text>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="550" y="147" width="140" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="620" y="200" text-anchor="middle">VFS</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M690 191 H780"/><polygon class="arrow" points="780,191 768,185 768,197"/>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="780" y="147" width="180" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="870" y="186" text-anchor="middle">Page cache</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="870" y="213" text-anchor="middle">RAM</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M960 191 H1050"/><polygon class="arrow" points="1050,191 1038,185 1038,197"/><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1005" y="174" text-anchor="middle">copy_to_user</text>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="1050" y="147" width="250" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="1175" y="200" text-anchor="middle">Application nhận data</text>

  <rect class="lane" fill="#fffef0" stroke="#8b5cf6" stroke-width="2" x="45" y="335" width="1350" height="245"/>
  <rect class="tag" fill="#e5e1ff" stroke="#8b5cf6" stroke-width="2" x="45" y="335" width="230" height="245"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="160" y="425" text-anchor="middle">Đọc block</text><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="160" y="454" text-anchor="middle">chưa cache</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="160" y="495" text-anchor="middle">có hardware I/O</text>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="300" y="397" width="140" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="370" y="450" text-anchor="middle">Application</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M440 441 H520"/><polygon class="arrow" points="520,441 508,435 508,447"/><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="480" y="424" text-anchor="middle">read()</text>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="520" y="397" width="180" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="610" y="435" text-anchor="middle">Filesystem</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="610" y="462" text-anchor="middle">block layer</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M700 441 H780"/><polygon class="arrow" points="780,441 768,435 768,447"/>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="780" y="397" width="190" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="875" y="435" text-anchor="middle">Storage driver</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="875" y="462" text-anchor="middle">queue + DMA</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M970 441 H1050"/><polygon class="arrow" points="1050,441 1038,435 1038,447"/>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="1050" y="397" width="270" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="1185" y="435" text-anchor="middle">Controller / disk</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1185" y="462" text-anchor="middle">đưa dữ liệu vào RAM</text>
  <path class="return" fill="none" stroke="#568d60" stroke-width="2.5" d="M1185 485 V530 H370 V485"/><polygon class="return-arrow" points="370,485 364,497 376,497"/><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="777" y="552" text-anchor="middle">interrupt/completion -> wake task -> trả dữ liệu</text>

  <rect class="lane" fill="#fffef0" stroke="#8b5cf6" stroke-width="2" x="45" y="615" width="1350" height="235"/>
  <rect class="tag" fill="#e5e1ff" stroke="#8b5cf6" stroke-width="2" x="45" y="615" width="230" height="235"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="160" y="700" text-anchor="middle">Điều khiển</text><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="160" y="729" text-anchor="middle">device</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="160" y="770" text-anchor="middle">lệnh riêng driver</text>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="300" y="680" width="180" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="390" y="717" text-anchor="middle">Application</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="390" y="744" text-anchor="middle">ioctl(fd, CMD)</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M480 724 H560"/><polygon class="arrow" points="560,724 548,718 548,730"/>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="560" y="680" width="180" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="650" y="717" text-anchor="middle">Syscall + VFS</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="650" y="744" text-anchor="middle">validate fd/arg</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M740 724 H820"/><polygon class="arrow" points="820,724 808,718 808,730"/>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="820" y="680" width="205" height="88"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="922" y="717" text-anchor="middle">Driver callback</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="922" y="744" text-anchor="middle">unlocked_ioctl</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M1025 724 H1105"/><polygon class="arrow" points="1105,724 1093,718 1093,730"/>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="1105" y="668" width="220" height="112"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="1215" y="706" text-anchor="middle">MMIO / DMA</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1215" y="735" text-anchor="middle">queue work hoặc</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1215" y="759" text-anchor="middle">chờ completion</text>
</svg>
