<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="590" viewBox="0 0 1450 590" role="img" aria-labelledby="title desc">
  <title id="title">KVM API theo file descriptor và ioctl</title>
  <desc id="desc">Open dev kvm tạo system fd, system fd tạo VM fd và VM fd tạo vCPU hoặc device fd.</desc>
  <defs>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#303030}.title{font-size:31px;font-weight:600}.h{font-size:19px;font-weight:600}.s{font-size:15px}.box{fill:#f0efff;stroke:#8b5cf6;stroke-width:2}.panel{fill:#fffef0;stroke:#8b5cf6;stroke-width:2}.note{fill:#fff7d6;stroke:#b6a536;stroke-width:2}.line{fill:none;stroke:#333333;stroke-width:2.5}.arrow{fill:#333333}</style>
  </defs>
  <rect class="panel" fill="#fffef0" stroke="#8b5cf6" stroke-width="2" x="15" y="15" width="1420" height="560"/>
  <text class="title" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="31" font-weight="700" x="725" y="58" text-anchor="middle">KVM API: mỗi file descriptor đại diện một kernel object</text>

  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="45" y="130" width="220" height="90"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="155" y="166" text-anchor="middle">open("/dev/kvm")</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="155" y="194" text-anchor="middle">userspace syscall</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M265 175 H345"/><polygon class="arrow" points="345,175 333,169 333,181"/>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="345" y="115" width="250" height="120"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="470" y="151" text-anchor="middle">KVM system fd</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="470" y="180" text-anchor="middle">KVM_CHECK_EXTENSION</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="470" y="207" text-anchor="middle">KVM_CREATE_VM</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M595 175 H675"/><polygon class="arrow" points="675,175 663,169 663,181"/>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="675" y="105" width="275" height="140"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="812" y="143" text-anchor="middle">VM fd</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="812" y="173" text-anchor="middle">SET_USER_MEMORY_REGION</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="812" y="200" text-anchor="middle">CREATE_DEVICE</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="812" y="227" text-anchor="middle">KVM_CREATE_VCPU</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M950 175 H1030"/><polygon class="arrow" points="1030,175 1018,169 1018,181"/>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="1030" y="105" width="325" height="140"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="1192" y="143" text-anchor="middle">vCPU fd</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1192" y="173" text-anchor="middle">GET/SET_REGS</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1192" y="200" text-anchor="middle">mmap(struct kvm_run)</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1192" y="227" text-anchor="middle">ioctl(KVM_RUN)</text>

  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M812 245 V300 H1165 V340"/><polygon class="arrow" points="1165,340 1159,328 1171,328"/>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="1000" y="340" width="330" height="105"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="1165" y="376" text-anchor="middle">Device fd</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1165" y="404" text-anchor="middle">query/set device attribute</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1165" y="429" text-anchor="middle">được tạo từ VM fd</text>
  <rect class="note" fill="#fff7d6" stroke="#b6a536" stroke-width="2" x="95" y="360" width="700" height="125"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="445" y="398" text-anchor="middle">Điểm cần nhớ</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="445" y="428" text-anchor="middle">fd xác định kernel object và phạm vi của ioctl</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="445" y="456" text-anchor="middle">KVM_RUN là request trên vCPU fd, không phải syscall riêng</text>
</svg>
