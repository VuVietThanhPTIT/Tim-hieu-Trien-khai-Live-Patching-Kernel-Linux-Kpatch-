<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Decision tree xử lý stalled livepatch transition</title>
  <desc id="desc">Kiểm tra transition, tìm blocker và stack, thử biện pháp an toàn, reverse hoặc force có phê duyệt.</desc>
  <defs>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#303030}.title{font-size:31px;font-weight:600}.h{font-size:18px;font-weight:600}.s{font-size:14px}.box{fill:#f0efff;stroke:#8b5cf6;stroke-width:2}.panel{fill:#fffef0;stroke:#8b5cf6;stroke-width:2}.ok{fill:#eaf7ec;stroke:#568d60;stroke-width:2}.wait{fill:#fff5dd;stroke:#bc9135;stroke-width:2}.warn{fill:#fdecec;stroke:#c65a5a;stroke-width:2}.danger{fill:#ffdede;stroke:#a83737;stroke-width:3}.line{fill:none;stroke:#333333;stroke-width:2.5}.arrow{fill:#333333}</style>
  </defs>
  <rect class="panel" fill="#fffef0" stroke="#8b5cf6" stroke-width="2" x="15" y="15" width="1370" height="870"/>
  <text class="title" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="31" font-weight="700" x="700" y="57" text-anchor="middle">Xử lý stalled transition theo mức độ an toàn</text>

  <polygon points="700,82 850,137 700,192 550,137" class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="700" y="133" text-anchor="middle">transition = 0?</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="700" y="155" text-anchor="middle">mọi task đã hội tụ?</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M850 137 H1063"/><polygon class="arrow" points="1063,137 1051,131 1051,143"/><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="950" y="121" text-anchor="middle">Có</text>
  <rect class="ok" fill="#eaf7ec" stroke="#568d60" stroke-width="2" x="1063" y="92" width="290" height="90"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="1208" y="127" text-anchor="middle">Verify rồi hoàn tất</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1208" y="154" text-anchor="middle">enabled + functional test</text>

  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M700 192 V250"/><polygon class="arrow" points="700,250 694,238 706,238"/><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="725" y="222">Không</text>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="495" y="250" width="410" height="90"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="700" y="285" text-anchor="middle">Liệt kê blocker và chụp stack</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="700" y="313" text-anchor="middle">TGID/TID, patch_state, wchan, nhiều mẫu stack</text>

  <path fill="none" stroke="#333333" stroke-width="2.5" d="M700 340 V385 H185 M700 385 H1215"/>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M185 385 V428"/><polygon class="arrow" points="185,428 179,416 191,416"/>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M700 385 V428"/><polygon class="arrow" points="700,428 694,416 706,416"/>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M1215 385 V428"/><polygon class="arrow" points="1215,428 1209,416 1221,416"/>
  <rect class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2" x="35" y="428" width="300" height="112"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="185" y="462" text-anchor="middle">Stack đang tiến triển</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="185" y="490" text-anchor="middle">chờ có timeout</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="185" y="515" text-anchor="middle">theo dõi transition</text>
  <rect class="wait" fill="#fff5dd" stroke="#bc9135" stroke-width="2" x="535" y="428" width="330" height="112"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="700" y="462" text-anchor="middle">Userspace/QEMU có thể wake</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="700" y="490" text-anchor="middle">kpatch signal / supported kick</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="700" y="515" text-anchor="middle">STOP/CONT khi SLA cho phép</text>
  <rect class="warn" fill="#fdecec" stroke="#c65a5a" stroke-width="2" x="1065" y="428" width="300" height="112"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="1215" y="462" text-anchor="middle">D-state / kthread</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1215" y="490" text-anchor="middle">xử lý subsystem hợp lệ</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1215" y="515" text-anchor="middle">không force mù</text>

  <path fill="none" stroke="#333333" stroke-width="2.5" d="M185 540 V570 H700 M1215 540 V570 H700"/>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M700 540 V600"/><polygon class="arrow" points="700,600 694,588 706,588"/>
  <polygon points="700,600 850,655 700,710 550,655" class="box" fill="#f0efff" stroke="#8b5cf6" stroke-width="2"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="700" y="651" text-anchor="middle">Vẫn stalled?</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="700" y="673" text-anchor="middle">sau biện pháp an toàn</text>

  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M550 655 H335"/><polygon class="arrow" points="335,655 347,649 347,661"/><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="445" y="637" text-anchor="middle">Có / chưa chứng minh safe</text>
  <rect class="warn" fill="#fdecec" stroke="#c65a5a" stroke-width="2" x="35" y="605" width="300" height="100"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="185" y="642" text-anchor="middle">Cancel / reverse</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="185" y="670" text-anchor="middle">redesign, migrate hoặc reboot</text>
  <path class="line" fill="none" stroke="#333333" stroke-width="2.5" d="M850 655 H1065"/><polygon class="arrow" points="1065,655 1053,649 1053,661"/><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="958" y="637" text-anchor="middle">Chỉ khi được phê duyệt</text>
  <rect class="danger" fill="#ffdede" stroke="#a83737" stroke-width="3" x="1065" y="595" width="300" height="120"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="1215" y="630" text-anchor="middle">FORCE - phương án cuối</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1215" y="658" text-anchor="middle">patch author xem stack</text><text class="s" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="15" x="1215" y="683" text-anchor="middle">không patch thêm, lên lịch reboot</text>

  <rect class="warn" fill="#fdecec" stroke="#c65a5a" stroke-width="2" x="230" y="800" width="940" height="52"/><text class="h" font-family="Arial, DejaVu Sans, sans-serif" fill="#303030" font-size="19" font-weight="700" x="700" y="833" text-anchor="middle">Không rmmod khi đang transition; không kill QEMU tùy tiện trên compute host</text>
</svg>
